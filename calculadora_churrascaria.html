<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#111827">
<title>Calculadora</title>
<style>
  :root { color-scheme: dark; --bg:#111827; --panel:#1f2937; --key:#374151; --accent:#16a34a; --text:#f9fafb; --muted:#9ca3af; }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body { margin:0; min-height:100%; background:var(--bg); color:var(--text); font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; }
  body { min-height:100dvh; display:flex; align-items:center; justify-content:center; padding:16px; }
  main { width:min(100%,480px); }
  h1 { font-size:1.15rem; font-weight:600; text-align:center; margin:0 0 14px; color:#e5e7eb; letter-spacing:.02em; }
  .calculator { background:var(--panel); border-radius:24px; padding:16px; box-shadow:0 16px 45px #0005; }
  .screen { min-height:120px; border-radius:16px; padding:18px 16px; background:#0b1220; display:flex; flex-direction:column; justify-content:flex-end; align-items:flex-end; margin-bottom:14px; overflow:hidden; }
  #previous { min-height:24px; color:var(--muted); font-size:1rem; overflow-wrap:anywhere; }
  #display { width:100%; text-align:right; font-size:clamp(2.2rem,10vw,3.4rem); line-height:1.15; font-variant-numeric:tabular-nums; overflow-wrap:anywhere; }
  .keys { display:grid; grid-template-columns:repeat(4,1fr); gap:9px; }
  button { border:0; min-height:66px; border-radius:15px; background:var(--key); color:var(--text); font:600 1.35rem system-ui,sans-serif; cursor:pointer; touch-action:manipulation; }
  button:active { filter:brightness(1.25); transform:scale(.98); }
  button.function { background:#4b5563; }
  button.operator { background:#14532d; }
  button.equals { background:var(--accent); color:white; }
  button.zero { grid-column:span 2; }
  .hint { text-align:center; color:var(--muted); font-size:.78rem; margin:12px 0 0; }
  @media (max-height:600px) { body{padding:8px} h1{margin-bottom:8px} .calculator{padding:10px} .screen{min-height:82px;padding:10px;margin-bottom:8px} .keys{gap:6px} button{min-height:48px;border-radius:11px} }
</style>
</head>
<body>
<main aria-label="Calculadora">
  <h1>CALCULADORA</h1>
  <section class="calculator">
    <div class="screen" aria-live="polite">
      <div id="previous"></div>
      <div id="display">0</div>
    </div>
    <div class="keys">
      <button class="function" data-action="clear">AC</button>
      <button class="function" data-action="sign">±</button>
      <button class="function" data-action="percent">%</button>
      <button class="operator" data-op="÷">÷</button>
      <button data-digit="7">7</button><button data-digit="8">8</button><button data-digit="9">9</button><button class="operator" data-op="×">×</button>
      <button data-digit="4">4</button><button data-digit="5">5</button><button data-digit="6">6</button><button class="operator" data-op="−">−</button>
      <button data-digit="1">1</button><button data-digit="2">2</button><button data-digit="3">3</button><button class="operator" data-op="+">+</button>
      <button class="zero" data-digit="0">0</button><button data-action="decimal">,</button><button class="equals" data-action="equals">=</button>
    </div>
    <p class="hint">Calculadora básica • Sem pesquisa ou links externos</p>
  </section>
</main>
<script>
(() => {
  const display = document.getElementById('display');
  const previous = document.getElementById('previous');
  let current = '0', stored = null, operation = null, fresh = false;
  const fmt = n => {
    if (!Number.isFinite(n)) return 'Erro';
    const rounded = Math.abs(n) < 1e12 ? Number(n.toPrecision(11)) : n;
    return String(rounded).replace('.', ',');
  };
  const numeric = () => Number(current.replace(',', '.'));
  const render = () => { display.textContent = current; };
  const digit = d => {
    if (current === 'Erro' || fresh) { current = d; fresh = false; }
    else if (current === '0') current = d;
    else if (current.replace('-', '').replace(',', '').length < 13) current += d;
    render();
  };
  const calculate = (a,b,op) => {
    if (op === '+') return a+b;
    if (op === '−') return a-b;
    if (op === '×') return a*b;
    if (op === '÷') return b === 0 ? NaN : a/b;
    return b;
  };
  document.querySelector('.keys').addEventListener('click', e => {
    const b = e.target.closest('button'); if (!b) return;
    if (b.dataset.digit !== undefined) { digit(b.dataset.digit); return; }
    if (b.dataset.op) {
      if (current === 'Erro') return;
      if (operation && !fresh) {
        const result = calculate(stored, numeric(), operation);
        current = fmt(result); render(); stored = Number(current.replace(',', '.'));
      } else stored = numeric();
      operation = b.dataset.op; previous.textContent = fmt(stored) + ' ' + operation; fresh = true; return;
    }
    switch (b.dataset.action) {
      case 'clear': current='0'; stored=null; operation=null; fresh=false; previous.textContent=''; render(); break;
      case 'decimal':
        if (fresh || current==='Erro') { current='0,'; fresh=false; }
        else if (!current.includes(',')) current+=',';
        render(); break;
      case 'sign':
        if (current!=='0' && current!=='Erro') current = current.startsWith('-') ? current.slice(1) : '-'+current;
        render(); break;
      case 'percent':
        if (current!=='Erro') current = fmt(numeric()/100);
        render(); break;
      case 'equals':
        if (operation && stored!==null && current!=='Erro') {
          const a=stored, op=operation, b=numeric(), result=calculate(a,b,op);
          previous.textContent = fmt(a)+' '+op+' '+fmt(b)+' =';
          current=fmt(result); stored=null; operation=null; fresh=true; render();
        }
        break;
    }
  });
  document.addEventListener('keydown', e => {
    if (/^[0-9]$/.test(e.key)) digit(e.key);
    else if (e.key === '.' || e.key === ',') document.querySelector('[data-action="decimal"]').click();
    else if (e.key === 'Enter' || e.key === '=') document.querySelector('[data-action="equals"]').click();
    else if (e.key === 'Escape' || e.key === 'Delete') document.querySelector('[data-action="clear"]').click();
    else if (e.key === '+') document.querySelector('[data-op="+"]').click();
    else if (e.key === '-') document.querySelector('[data-op="−"]').click();
    else if (e.key === '*') document.querySelector('[data-op="×"]').click();
    else if (e.key === '/') document.querySelector('[data-op="÷"]').click();
  });
})();
</script>
</body>
</html>
